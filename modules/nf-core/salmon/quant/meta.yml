name: salmon_quant
description: gene/transcript quantification with Salmon
keywords:
  - index
  - fasta
  - genome
  - reference
tools:
  - salmon:
      description: |
        Salmon is a tool for wicked-fast transcript quantification from RNA-seq data
      homepage: https://salmon.readthedocs.io/en/latest/salmon.html
      manual: https://salmon.readthedocs.io/en/latest/salmon.html
      doi: 10.1038/nmeth.4197
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:salmon
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: |
          List of input FastQ files for single-end or paired-end data, or a
          single BAM of reads already aligned to the transcriptome (a `.bam`
          extension switches the module into salmon's alignment mode). Pass
          `--libType` via `ext.args` to select a specific library type;
          salmon auto-detects it otherwise.
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - index:
        type: directory
        description: |
          Folder containing the salmon index files. Required for reads
          mode; pass `[]` in alignment mode.
    - gtf:
        type: file
        description: GTF of the reference transcriptome
        ontologies: []
    - transcript_fasta:
        type: file
        description: |
          Fasta file of the reference transcriptome. Required in alignment
          mode as the `-t` reference; pass `[]` in reads mode.
        ontologies: []
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}:
          type: directory
          description: Folder containing the quantification results for a specific sample
          pattern: "${prefix}"
  json_info:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*info.json":
          type: file
          description: File containing meta information from Salmon quant
          pattern: "*info.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  lib_format_counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*lib_format_counts.json":
          type: file
          description: File containing the library format counts
          pattern: "*lib_format_counts.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  versions_salmon:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - salmon:
          type: string
          description: The tool name
      - salmon --version | sed -e "s/salmon //g":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - salmon:
          type: string
          description: The tool name
      - salmon --version | sed -e "s/salmon //g":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@kevinmenden"
  - "@drpatelh"
maintainers:
  - "@kevinmenden"
  - "@drpatelh"
