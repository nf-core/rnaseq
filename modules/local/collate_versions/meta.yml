# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "collate_versions"
description: Write the software version entries to a single file, one entry per line, in the given order.
keywords:
  - versions
  - collate
tools: []
input:
  - name:
      type: string
      description: Name of the output file
  - entries:
      type: list
      description: Software version entries, already in their final order
output:
  - "${name}":
      type: file
      description: File with one software version entry per line
      pattern: "*.yml"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
