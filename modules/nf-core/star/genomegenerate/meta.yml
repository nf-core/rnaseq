name: star_genomegenerate
description: Create index for STAR
keywords:
  - index
  - fasta
  - genome
  - reference
  - multi-tool
  - star
  - samtools
  - gawk
tools:
  - star:
      description: |
        STAR is a software package for mapping DNA sequences against
        a large reference genome, such as the human genome.
      homepage: https://github.com/alexdobin/STAR
      manual: https://github.com/alexdobin/STAR/blob/master/doc/STARmanual.pdf
      doi: 10.1093/bioinformatics/bts635
      licence:
        - "MIT"
      args_id: "$args"
      identifier: biotools:star
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats, written by Heng Li.
        These files are generated as output by short read aligners like BWA.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - "MIT"
      args_id: "$args2"
      identifier: biotools:samtools
  - gawk:
      description: "GNU awk"
      homepage: "https://www.gnu.org/software/gawk/"
      documentation: "https://www.gnu.org/software/gawk/manual/"
      tool_dev_url: "https://www.gnu.org/prep/ftp.html"
      licence:
        - "GPL v3"
      args_id: "$args3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Fasta file of the reference genome
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - gtf:
        type: file
        description: Optional GTF file of the reference genome, used to build the splice junction database
        ontologies:
          - edam: "http://edamontology.org/format_2306" # GTF
output:
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - star:
          type: directory
          description: Folder containing the star index files
          pattern: "star"
  versions_star:
    - - ${task.process}:
          type: string
          description: The name of the process
      - star:
          type: string
          description: The name of the tool
      - 'STAR --version | sed -e "s/STAR_//g"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools --version | sed -n '1s/samtools //p'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_gawk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - "gawk --version | sed -n '1{s/GNU Awk //;s/,.*//;p}'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - star:
          type: string
          description: The name of the tool
      - 'STAR --version | sed -e "s/STAR_//g"':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - "samtools --version | sed -n '1s/samtools //p'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - gawk:
          type: string
          description: The name of the tool
      - "gawk --version | sed -n '1{s/GNU Awk //;s/,.*//;p}'":
          type: eval
          description: The expression to obtain the version of the tool

