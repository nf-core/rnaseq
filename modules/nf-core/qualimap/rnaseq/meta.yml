name: qualimap_rnaseq
description: Evaluate alignment data
keywords:
  - quality control
  - qc
  - rnaseq
tools:
  - qualimap:
      description: |
        Qualimap 2 is a platform-independent application written in
        Java and R that provides both a Graphical User Interface and
        a command-line interface to facilitate the quality control of
        alignment sequencing data and its derivatives like feature counts.
      homepage: http://qualimap.bioinfo.cipf.es/
      documentation: http://qualimap.conesalab.org/doc_html/index.html
      doi: 10.1093/bioinformatics/bts503
      licence:
        - "GPL-2.0-only"
      identifier: biotools:qualimap
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false, strandedness:'forward' ]
          meta.strandedness can be use in ext.args to set `-p` argument
          (see ./tests/nextflow.config)
    - bam:
        type: file
        description: BAM file
        pattern: "*.{bam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - gtf:
        type: file
        description: GTF file of the reference genome
        pattern: "*.{gtf}"
        ontologies: []
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}:
          type: directory
          description: Qualimap results dir
          pattern: "*/*"
  versions_qualimap:
    - - ${task.process}:
          type: string
          description: The name of the process
      - qualimap:
          type: string
          description: The name of the tool
      - qualimap -h | sed -n 's/^QualiMap v.//p':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - qualimap:
          type: string
          description: The name of the tool
      - qualimap -h | sed -n 's/^QualiMap v.//p':
          type: eval
          description: The expression to obtain the version of the tool

