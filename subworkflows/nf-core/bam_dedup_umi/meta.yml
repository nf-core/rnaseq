name: "bam_dedup_umi"
description: BAM deduplication with UMI processing for both genome and transcriptome alignments
keywords:
  - deduplication
  - UMI
  - BAM
  - genome
  - transcriptome
  - umicollapse
  - umitools

components:
  - umitools/prepareforrsem
  - samtools/sort
  - bam_dedup_stats_samtools_umicollapse
  - bam_dedup_stats_samtools_umitools
  - bam_sort_stats_samtools

input:
  - ch_genome_bam:
      description: Channel with genome BAM files
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: BAM file
            pattern: "*.bam"
        - bai:
            type: file
            description: BAM index file
            pattern: "*.bai"
  - ch_fasta_fai:
      description: Channel with genome FASTA file and index
      structure:
        - meta:
            type: map
            description: Metadata map
        - fasta:
            type: file
            description: Genome FASTA file
            pattern: "*.{fa,fna,fasta}"
        - fai:
            type: file
            description: Genome FASTA index file
            pattern: "*.fai"
  - umi_dedup_tool:
      description: UMI deduplication tool to use
      structure:
        - value:
            type: string
            description: Either 'umicollapse' or 'umitools'
  - umitools_dedup_stats:
      description: Whether to generate UMI-tools deduplication stats
      structure:
        - value:
            type: boolean
            description: True or False
  - ch_transcriptome_bam:
      description: Channel with transcriptome BAM files
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: BAM file
            pattern: "*.bam"
  - ch_transcript_fasta_fai:
      description: Channel with transcript FASTA file and index
      structure:
        - meta:
            type: map
            description: Metadata map
        - fasta:
            type: file
            description: Transcript FASTA file
            pattern: "*.{fa,fasta}"
        - fai:
            type: file
            description: Transcript FASTA index file
            pattern: "*.fai"
  - umitools_dedup_primary_only:
      description: Whether to filter to primary alignments before UMI-tools dedup
      structure:
        - value:
            type: boolean
            description: |
              When true, secondary and supplementary alignments (SAM flag 0x900) are
              removed before running UMI-tools dedup so that dedup statistics reflect
              only primary alignments.

output:
  - bam:
      description: Channel containing deduplicated genome BAM files
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: Deduplicated BAM file
            pattern: "*.bam"
  - index:
      description: Channel containing the index of the deduplicated genome BAM
      structure:
        - meta:
            type: map
            description: Metadata map
        - index:
            type: file
            description: BAM index file
            pattern: "*.{bai,csi}"
  - genomic_dedup_log:
      description: Channel containing deduplication log files for the genome BAM
      structure:
        - meta:
            type: map
            description: Metadata map
        - log:
            type: file
            description: Deduplication log file
            pattern: "*.log"
  - transcriptomic_dedup_log:
      description: Channel containing deduplication log files for the transcriptome BAM
      structure:
        - meta:
            type: map
            description: Metadata map
        - log:
            type: file
            description: Deduplication log file
            pattern: "*.log"
  - prepare_for_rsem_log:
      description: Channel containing the UMI-tools prepare_for_rsem log for paired-end BAM files
      structure:
        - meta:
            type: map
            description: Metadata map
        - log:
            type: file
            description: prepare_for_rsem log file
            pattern: "*.log"
  - stats:
      description: Channel containing BAM statistics files for both genome and transcriptome BAMs
      structure:
        - meta:
            type: map
            description: Metadata map
        - stats:
            type: file
            description: BAM statistics file
            pattern: "*.stats"
  - flagstat:
      description: Channel containing flagstat files for both genome and transcriptome BAMs
      structure:
        - meta:
            type: map
            description: Metadata map
        - flagstat:
            type: file
            description: Flagstat file
            pattern: "*.flagstat"
  - idxstats:
      description: Channel containing idxstats files for both genome and transcriptome BAMs
      structure:
        - meta:
            type: map
            description: Metadata map
        - idxstats:
            type: file
            description: Idxstats file
            pattern: "*.idxstats"
  - genome_stats:
      description: Channel containing BAM statistics for the genome-aligned BAM only (transcriptome excluded)
      structure:
        - meta:
            type: map
            description: Metadata map
        - stats:
            type: file
            description: BAM statistics file
            pattern: "*.stats"
  - genome_flagstat:
      description: Channel containing flagstat for the genome-aligned BAM only
      structure:
        - meta:
            type: map
            description: Metadata map
        - flagstat:
            type: file
            description: Flagstat file
            pattern: "*.flagstat"
  - genome_idxstats:
      description: Channel containing idxstats for the genome-aligned BAM only
      structure:
        - meta:
            type: map
            description: Metadata map
        - idxstats:
            type: file
            description: Idxstats file
            pattern: "*.idxstats"
  - tsv_edit_distance:
      description: |
        Channel containing the UMI-tools edit distance TSV, reporting the
        edit distance between the UMIs at each position. Only populated when
        umi_dedup_tool is 'umitools'.
      structure:
        - meta:
            type: map
            description: Metadata map
        - tsv:
            type: file
            description: Edit distance TSV file
            pattern: "*edit_distance.tsv"
  - tsv_per_umi:
      description: |
        Channel containing the UMI-tools per UMI TSV, reporting UMI-level summary
        statistics. Only populated when umi_dedup_tool is 'umitools'.
      structure:
        - meta:
            type: map
            description: Metadata map
        - tsv:
            type: file
            description: Per UMI TSV file
            pattern: "*per_umi.tsv"
  - tsv_umi_per_position:
      description: |
        Channel containing the UMI-tools TSV tabulating the counts for unique
        combinations of UMI and position. Only populated when umi_dedup_tool is
        'umitools'.
      structure:
        - meta:
            type: map
            description: Metadata map
        - tsv:
            type: file
            description: UMI per position TSV file
            pattern: "*per_position.tsv"
  - multiqc_files:
      description: Channel containing files for MultiQC
      structure:
        - meta:
            type: map
            description: Metadata map
        - file:
            type: file
            description: File for MultiQC
  - transcriptome_bam:
      description: Channel containing the final deduplicated transcriptome BAM files
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: Deduplicated transcriptome BAM file
            pattern: "*.bam"
  - transcriptome_dedup_bam:
      description: Channel containing the transcriptome BAM after deduplication, before name sorting
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: Deduplicated transcriptome BAM file
            pattern: "*.bam"
  - transcriptome_sorted_bam:
      description: Channel containing the name-sorted deduplicated transcriptome BAM
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: Name-sorted transcriptome BAM file
            pattern: "*.bam"
  - transcriptome_sorted_bam_index:
      description: Channel containing the index of the coordinate-sorted deduplicated transcriptome BAM
      structure:
        - meta:
            type: map
            description: Metadata map
        - index:
            type: file
            description: BAM index file
            pattern: "*.{bai,csi}"
  - transcriptome_filtered_bam:
      description: Channel containing the paired-end transcriptome BAM filtered by UMI-tools prepare_for_rsem
      structure:
        - meta:
            type: map
            description: Metadata map
        - bam:
            type: file
            description: Filtered transcriptome BAM file
            pattern: "*.bam"
  - per_sample_mqc_bundle:
      description: |
        Per-sample MultiQC-feeding outputs (genome-side only: genomic dedup log,
        genome stats, flagstat, idxstats) joined on meta. Transcriptome stats
        excluded (MultiQC can't disambiguate them from genome stats).
      structure:
        - meta:
            type: map
            description: Metadata map
        - files:
            type: file
            description: List of MultiQC-relevant files for the sample

authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
