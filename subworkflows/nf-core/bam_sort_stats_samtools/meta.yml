# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: bam_sort_stats_samtools
description: Sort SAM/BAM/CRAM file
keywords:
  - sort
  - bam
  - sam
  - cram
components:
  - samtools/sort
  - samtools/index
  - samtools/stats
  - samtools/idxstats
  - samtools/flagstat
  - bam_stats_samtools
input:
  - ch_bam:
      type: file
      description: |
        BAM/CRAM/SAM file.

        Structure: [ val(meta), path(bam) ]
      pattern: "*.{bam,cram,sam}"

  - ch_fasta_fai:
      type: file
      description: |
        Reference genome fasta file and its index.

        Structure: [ val(meta), path(fasta), path(fai) ]
      pattern: "*.{fasta,fa}"

output:
  - bam:
      type: file
      description: |
        Sorted BAM/CRAM/SAM file.

        Structure: [ val(meta), path(bam) ]
      pattern: "*.{bam,cram,sam}"

  - index:
      type: file
      description: |
        BAM/CRAM/SAM index file.

        Structure: [ val(meta), path(index) ]
      pattern: "*.{bai,crai,csi}"

  - stats:
      type: file
      description: |
        File containing samtools stats output.

        Structure: [ val(meta), path(stats) ]
      pattern: "*.stats"

  - flagstat:
      type: file
      description: |
        File containing samtools flagstat output.

        Structure: [ val(meta), path(flagstat) ]
      pattern: "*.flagstat"

  - idxstats:
      type: file
      description: |
        File containing samtools idxstats output.

        Structure: [ val(meta), path(idxstats) ]
      pattern: "*.idxstats"

authors:
  - "@drpatelh"
  - "@ewels"
maintainers:
  - "@drpatelh"
  - "@ewels"
