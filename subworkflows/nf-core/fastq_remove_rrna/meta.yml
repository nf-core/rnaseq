# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fastq_remove_rrna"
description: Remove ribosomal RNA reads from FASTQ files using SortMeRNA, RiboDetector, or Bowtie2
keywords:
  - fastq
  - rrna
  - ribosomal
  - filter
  - sortmerna
  - ribodetector
  - bowtie2
components:
  - bowtie2/align
  - bowtie2/build
  - ribodetector
  - samtools/fastq
  - samtools/view
  - seqkit/replace
  - seqkit/stats
  - sortmerna
input:
  - ch_reads:
      type: file
      description: |
        List of FastQ files of size 1 and 2 for single-end and paired-end data, respectively.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fq,fastq}{,.gz}"
  - ch_rrna_fastas:
      type: file
      description: |
        Channel containing one or more FASTA files with rRNA sequences for use with SortMeRNA or Bowtie2.
        Not required for RiboDetector which uses built-in models.

        Structure: [ path(fasta) ]
      pattern: "*.{fa,fasta}{,.gz}"
  - ch_sortmerna_index:
      type: directory
      description: |
        Pre-built SortMeRNA index directory. Optional - can be built on-the-fly if make_sortmerna_index is true.

        Structure: [ val(meta), path(index) ]
  - ch_bowtie2_index:
      type: directory
      description: |
        Pre-built Bowtie2 index directory. Optional - can be built on-the-fly if make_bowtie2_index is true.

        Structure: [ val(meta), path(index) ]
  - ribo_removal_tool:
      type: string
      description: Specifies the rRNA removal tool to use
      enum: ["sortmerna", "ribodetector", "bowtie2"]
  - make_sortmerna_index:
      type: boolean
      description: Whether to create SortMeRNA index before running SortMeRNA
  - make_bowtie2_index:
      type: boolean
      description: Whether to create Bowtie2 index before running Bowtie2 for rRNA removal
output:
  - reads:
      type: file
      description: |
        FASTQ files with rRNA reads removed.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fq,fastq}{,.gz}"
  - multiqc_files:
      type: file
      description: |
        Log files from the rRNA removal tool, compatible with MultiQC.

        Structure: [ val(meta), path(log) ]
  - sortmerna_log:
      type: file
      description: |
        SortMeRNA log file, only populated when sortmerna is the rRNA removal tool.

        Structure: [ val(meta), path(log) ]
      pattern: "*.log"
  - ribodetector_log:
      type: file
      description: |
        RiboDetector log file, only populated when ribodetector is the rRNA removal tool.

        Structure: [ val(meta), path(log) ]
      pattern: "*.log"
  - seqkit_stats:
      type: file
      description: |
        SeqKit statistics used to derive the mean read length for RiboDetector, only
        populated when ribodetector is the rRNA removal tool.

        Structure: [ val(meta), path(stats) ]
      pattern: "*.tsv"
  - bowtie2_log:
      type: file
      description: |
        Bowtie2 alignment log files, only populated when bowtie2 is the rRNA removal tool.

        Structure: [ val(meta), path(log) ]
      pattern: "*.log"
  - bowtie2_index:
      type: directory
      description: |
        Bowtie2 index built from the rRNA references, only populated when bowtie2 is the
        rRNA removal tool and make_bowtie2_index is true.

        Structure: [ val(meta), path(index) ]
  - seqkit_prefixed:
      type: file
      description: |
        rRNA reference fasta files with their filename added as a prefix to each sequence
        header, only populated when a Bowtie2 index is built.

        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}{,.gz}"
  - seqkit_converted:
      type: file
      description: |
        Prefixed rRNA reference fasta files with U bases converted to T, only populated
        when a Bowtie2 index is built.

        Structure: [ val(meta), path(fasta) ]
      pattern: "*.{fa,fasta}{,.gz}"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
