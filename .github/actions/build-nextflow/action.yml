name: "Build Nextflow"
description: "TEMPORARY: builds a Nextflow launcher from a pinned upstream commit and uploads it as an artifact"
# The output {} block needs nextflow-io/nextflow#7646 and #7674, which are merged upstream but not
# in a release yet. Delete this action, the build-nextflow jobs and the custom-install steps in
# .github/actions/nf-test/action.yml once a release contains both.
runs:
  using: "composite"
  steps:
    - name: Check out Nextflow
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        repository: nextflow-io/nextflow
        ref: 4745fb4cb059ccb0b7fabecb53543477549cdc33
        path: nextflow-src

    - name: Set up Java
      uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: "21"

    - name: Build launcher
      shell: bash
      working-directory: nextflow-src
      run: |
        make pack
        cp build/releases/nextflow-*-dist "${{ runner.temp }}/nextflow"

    - name: Upload launcher
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: nextflow-custom
        path: ${{ runner.temp }}/nextflow
        retention-days: 1
