name: seqkit_replace
description: Use seqkit to find/replace strings within sequences and sequence headers
keywords:
  - seqkit
  - replace
  - sequence
  - sequence headers
  - fasta
tools:
  - seqkit:
      description: Cross-platform and ultrafast toolkit for FASTA/Q file manipulation, written by Wei Shen.
      homepage: https://bioinf.shenwei.me/seqkit/usage/
      documentation: https://bioinf.shenwei.me/seqkit/usage/
      tool_dev_url: https://github.com/shenwei356/seqkit/
      doi: "10.1371/journal.pone.016396"
      publication:
        author: "Shen, W., Le, S., Li, Y. & Hu, F."
        year: 2016
        title: "SeqKit: A Cross-Platform and Ultrafast Toolkit for FASTA/Q File Manipulation"
        source: "PLoS ONE"
      identifier: biotools:seqkit
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fastx:
        type: file
        description: fasta/q file
        pattern: "*.{fasta,fastq,fa,fq,fas,fna,faa}*"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
  - out_ext:
      type: string
      description: >
        Output file extension. Leave empty to auto-detect from input (for example
        `.fasta`, `.fasta.gz`)
output:
  fastx:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fast*":
          type: file
          description: fasta/q file with replaced values
          pattern: "*.{fasta,fastq,fa,fq,fas,fna,faa}*"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  versions_seqkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - seqkit version | sed 's/^.*v//':
          type: eval
          description: The expression to obtain the version of seqkit

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - seqkit:
          type: string
          description: The name of the tool
      - seqkit version | sed 's/^.*v//':
          type: eval
          description: The expression to obtain the version of seqkit

