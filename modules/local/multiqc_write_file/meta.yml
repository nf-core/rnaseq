# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "multiqc_write_file"
description: Write a text string to a file with the given name, exactly as given (no line ending is added).
keywords:
  - multiqc
  - custom content
tools: []
input:
  - - id:
        type: string
        description: Identifier of the file, used as the task tag
    - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - name:
        type: string
        description: Name of the file to write
    - content:
        type: string
        description: Text written to the file
output:
  file:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - file:
          type: file
          description: The written file, named by the `name` input
          pattern: "*"
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
