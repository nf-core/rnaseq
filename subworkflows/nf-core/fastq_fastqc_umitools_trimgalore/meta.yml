# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "fastq_fastqc_umitools_trimgalore"
description: Read QC, UMI extraction and trimming
keywords:
  - fastq
  - fastqc
  - qc
  - UMI
  - trimming
  - trimgalore
components:
  - fastqc
  - umitools/extract
  - trimgalore
input:
  - reads:
      type: file
      description: |
        List of input FastQ files of size 1 and 2 for single-end and paired-end data,
        respectively.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - skip_fastqc:
      type: boolean
      description: |
        Skip fastqc process
  - with_umi:
      type: boolean
      description: |
        With or without umi detection
  - skip_umi_extract:
      type: boolean
      description: |
        With or without umi extrection
  - skip_trimming:
      type: boolean
      description: |
        Allows to skip trimgalore execution
  - umi_discard_read:
      type: integer
      description: |
        Discard R1 / R2 if required
  - min_trimmed_reads:
      type: integer
      description: |
        Inputs with fewer than this reads will be filtered out of the "reads" output channel
output:
  - reads:
      type: file
      description: |
        FastQ files after optional UMI extraction and adapter trimming, filtered on
        the minimum trimmed read count.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - fastqc_html:
      type: file
      description: |
        FastQC report.

        Structure: [ val(meta), [ path(html) ] ]
      pattern: "*_{fastqc.html}"
  - fastqc_zip:
      type: file
      description: |
        FastQC report archive.

        Structure: [ val(meta), [ path(zip) ] ]
      pattern: "*_{fastqc.zip}"
  - umi_log:
      type: file
      description: |
        Logfile for umi_tools.

        Structure: [ val(meta), path(log) ]
      pattern: "*.{log}"
  - umi_reads:
      type: file
      description: >
        Extracted FASTQ files. | For single-end reads, pattern is \${prefix}.umi_extract.fastq.gz. |



          For paired-end reads, pattern is \${prefix}.umi_extract_{1,2}.fastq.gz. |



          Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - trim_unpaired:
      type: file
      description: |
        FastQ files containing unpaired reads from read 1 or read 2.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*unpaired*.fq.gz"
  - trim_html:
      type: file
      description: |
        FastQC report (optional).

        Structure: [ val(meta), [ path(html) ] ]
      pattern: "*_{fastqc.html}"
  - trim_zip:
      type: file
      description: |
        FastQC report archive (optional).

        Structure: [ val(meta), [ path(zip) ] ]
      pattern: "*_{fastqc.zip}"
  - trim_log:
      type: file
      description: |
        Trim Galore! trimming report.

        Structure: [ val(meta), [ path(txt) ] ]
      pattern: "*_{report.txt}"
  - trim_read_count:
      type: integer
      description: |
        Number of reads remaining after trimming for all input samples.

        Structure: [ val(meta), val(count) ]
authors:
  - "@drpatelh"
  - "@KamilMaliszArdigen"
maintainers:
  - "@drpatelh"
  - "@KamilMaliszArdigen"
