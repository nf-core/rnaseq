# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
# yaml-language-server: $schema=yaml-schema.json
name: "fastq_fastqc_umitools_fastp"
description: Read QC, UMI extraction and trimming
keywords:
  - fastq
  - fastqc
  - qc
  - UMI
  - trimming
  - fastp
components:
  - fastqc
  - umitools/extract
  - fastp
input:
  - reads:
      type: file
      description: |
        List of input FastQ files of size 1 and 2 for single-end and paired-end data,
        respectively, together with an optional fasta file of adapter sequences.

        Structure: [ val(meta), [ path(reads) ], path(adapter_fasta) ]
      pattern: "*.{fastq.gz}"
  - skip_fastqc:
      type: boolean
      description: |
        Skip fastqc process
  - with_umi:
      type: boolean
      description: |
        With or without umi detection
  - skip_umi_extract:
      type: boolean
      description: |
        With or without umi extraction
  - umi_discard_read:
      type: integer
      description: |
        Discard R1 / R2 if required
  - skip_trimming:
      type: boolean
      description: |
        Allows to skip FastP execution
  - save_trimmed_fail:
      type: boolean
      description: |
        Save trimmed fastqs of failed samples
  - save_merged:
      type: boolean
      description: |
        Save merged fastqs
  - min_trimmed_reads:
      type: integer
      description: |
        Inputs with fewer than this reads will be filtered out of the "reads" output channel
output:
  - reads:
      type: file
      description: |
        Trimmed FastQ files, UMI-extracted if requested, with samples below
        `min_trimmed_reads` filtered out.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - fastqc_raw_html:
      type: file
      description: |
        FastQC report for the raw reads.

        Structure: [ val(meta), [ path(html) ] ]
      pattern: "*_{fastqc.html}"
  - fastqc_raw_zip:
      type: file
      description: |
        FastQC report archive for the raw reads.

        Structure: [ val(meta), [ path(zip) ] ]
      pattern: "*_{fastqc.zip}"
  - umi_log:
      type: file
      description: |
        Logfile for umi_tools extract.

        Structure: [ val(meta), path(log) ]
      pattern: "*.{log}"
  - umi_reads:
      type: file
      description: >
        UMI-extracted FastQ files, before trimming. | For single-end reads, pattern is \${prefix}.umi_extract.fastq.gz. |
        For paired-end reads, pattern is \${prefix}.umi_extract_{1,2}.fastq.gz. | Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - adapter_seq:
      type: string
      description: |
        Adapter sequence found in read1, parsed from the FastP JSON report.

        Structure: [ val(meta), val(adapter_seq) ]
  - trim_json:
      type: file
      description: |
        FastP trimming report.

        Structure: [ val(meta), path(json) ]
      pattern: "*.{fastp.json}"
  - trim_html:
      type: file
      description: |
        FastP trimming report.

        Structure: [ val(meta), path(html) ]
      pattern: "*.{fastp.html}"
  - trim_log:
      type: file
      description: |
        Logfile FastP.

        Structure: [ val(meta), path(log) ]
      pattern: "*.{fastp.log}"
  - trim_reads_fail:
      type: file
      description: |
        Trimmed fastq files failing QC.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - trim_reads_merged:
      type: file
      description: |
        Trimmed and merged fastq files.

        Structure: [ val(meta), [ path(reads) ] ]
      pattern: "*.{fastq.gz}"
  - trim_read_count:
      type: integer
      description: |
        Number of reads after trimming.

        Structure: [ val(meta), val(count) ]
  - fastqc_trim_html:
      type: file
      description: |
        FastQC report for the trimmed reads.

        Structure: [ val(meta), [ path(html) ] ]
      pattern: "*_{fastqc.html}"
  - fastqc_trim_zip:
      type: file
      description: |
        FastQC report archive for the trimmed reads.

        Structure: [ val(meta), [ path(zip) ] ]
      pattern: "*_{fastqc.zip}"
authors:
  - "@robsyme"
maintainers:
  - "@robsyme"
